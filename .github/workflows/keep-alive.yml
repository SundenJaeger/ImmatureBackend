name: Render Keep Alive

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Prod
        env:
          RENDER_URL: ${{vars.RENDER_PROD_URL}}
        run: curl -fsS "$RENDER_URL/health"

      - name: Ping Render Dev
        env:
          RENDER_URL: ${{vars.RENDER_DEV_URL}}
        run: curl -fsS "$RENDER_URL/health"